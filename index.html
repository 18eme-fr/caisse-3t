<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Caisse du 3T</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caisse 3T">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Fredoka-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Polices intégrées à l'appli (fonctionnent sans réseau), licence SIL OFL 1.1 :
   Fredoka, ronde comme le logo, pour les titres, prix et boutons ; Geist pour les petits textes */
@font-face {
  font-family: "Fredoka"; src: url("fonts/Fredoka-Variable.woff2") format("woff2");
  font-weight: 300 700; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2");
  font-weight: 100 900; font-style: normal; font-display: swap;
}
/* Layout : grille de tuiles tactiles par rayon, barre d'addition fixée en bas, feuille d'encaissement qui monte du bas */
:root {
  /* Charte du logo 3T : blanc et rose framboise #EC005C, comme le logo. Un seul thème, clair. */
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --ink: #2a0f1c;
  --muted: #a0577a;
  --line: #f7c6da;
  --wine: #ec005c;
  --wine-text: #ec005c;
  --wine-ink: #ffffff;
  --wine-soft: #ffe8f1;
  --ok: #ec005c;
  --warn: #b4441c;
  --shadow: 0 1px 2px rgba(120, 0, 50, .07), 0 4px 14px rgba(120, 0, 50, .06);
  --display: "Fredoka", "Geist", -apple-system, "Segoe UI", system-ui, sans-serif;
  --body: "Geist", -apple-system, "Segoe UI", system-ui, sans-serif;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px;
  padding: 0 16px; padding-bottom: calc(160px + env(safe-area-inset-bottom, 0px));
  max-width: 900px; margin: 0 auto;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--wine); outline-offset: 2px; }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 14px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.owner {
  min-width: 0; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: auto;
  border: 0; background: var(--wine-soft); color: var(--wine-text); font-weight: 700; font-size: .85rem; border-radius: 999px; padding: 6px 12px;
}
.sheet.center {
  top: 50%; bottom: auto; left: 16px; right: 16px; max-width: 400px; margin: 0 auto;
  transform: translateY(-50%); border-radius: 20px; padding: 24px 20px; animation: none;
}
.owner-form { align-items: center; text-align: center; }
.form.owner-form label { font-family: var(--display); font-weight: 700; font-size: 1.3rem; color: var(--wine-text); }
.form.owner-form input { width: 100%; text-align: center; font-size: 1.2rem; }
.owner-logo { height: 80px; width: auto; }
.btn.wide { width: 100%; }
.linkish { border: 0; background: none; padding: 0; color: var(--wine-text); font-weight: 700; text-decoration: underline; font-size: inherit; }
.logo-btn { border: 0; padding: 0; background: none; border-radius: 10px; flex: none; }
.brand .logo { height: 52px; width: auto; background: #fff; border-radius: 10px; padding: 3px 5px; flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.brand h1 { font-family: var(--display); font-weight: 700; font-size: 1.55rem; margin: 0; letter-spacing: -.01em; line-height: 1.05; }
.brand h1 span { color: var(--wine-text); }
.brand small { color: var(--muted); font-size: .8rem; }
.top-actions { display: flex; gap: 8px; }
.chip-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 8px 12px; font-size: .82rem; font-weight: 500; white-space: nowrap;
}
.chip-btn[aria-pressed="true"] { background: var(--wine); color: var(--wine-ink); border-color: var(--wine-text); }


.day {
  display: flex; gap: 16px; padding-block: 10px; color: var(--muted); font-size: .82rem; flex-wrap: wrap;
}
.day b { color: var(--ink); font-weight: 700; }

section.rayon { padding-block: 10px; }
section.rayon h2 {
  font-family: var(--display); font-weight: 600; font-size: .85rem; text-transform: uppercase;
  letter-spacing: .1em; color: var(--wine-text); margin: 0 0 10px;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--head-h, 72px)); z-index: 4;
  background: var(--bg); padding-block: 8px; margin-inline: -16px; padding-inline: 16px;
}
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 820px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

.tile {
  position: relative; text-align: left; border: 1.5px solid var(--line); background: var(--surface);
  border-radius: 14px; padding: 14px 12px 12px; min-height: 96px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
  user-select: none; touch-action: manipulation; transition: transform .08s ease, border-color .15s;
}
.tile:active { transform: scale(.97); }
.tile.has { border-color: var(--wine-text); background: var(--wine-soft); }
.tile .name { font-family: var(--display); font-weight: 500; font-size: 1.08rem; line-height: 1.2; padding-right: 34px; overflow-wrap: anywhere; }
.tile .desc { font-size: .74rem; color: var(--muted); line-height: 1.25; }
.tile.has .desc { padding-right: 46px; }
.tile .price { font-family: var(--display); font-weight: 600; font-size: 1.25rem; color: var(--wine-text); }
.tile .qty {
  position: absolute; top: 10px; right: 10px; min-width: 30px; height: 30px; border-radius: 999px;
  background: var(--wine); color: var(--wine-ink); font-weight: 700; display: grid; place-items: center;
  padding: 0 8px; font-size: .95rem;
}
.tile .minus {
  position: absolute; bottom: 8px; right: 8px; width: 40px; height: 40px; border-radius: 10px;
  border: 1px solid var(--wine); background: var(--surface); color: var(--wine-text); font-size: 1.4rem; line-height: 1;
  display: grid; place-items: center;
}
.tile.add { border-style: dashed; box-shadow: none; background: transparent; align-items: center; justify-content: center; color: var(--muted); font-weight: 500; }
.editing .tile:not(.add)::after {
  content: "Modifier"; position: absolute; top: 10px; right: 10px; font-size: .7rem; color: var(--muted);
  border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; background: var(--bg);
}

/* Barre du bas */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--wine); color: #fff;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -6px 20px rgba(120, 0, 50, .15);
}
.bar .sum small { color: #fff !important; opacity: .85; }
.bar #btn-pay { background: #fff; color: var(--wine); }
.bar #btn-clear { background: transparent; color: #fff; border: 1.5px solid rgba(255, 255, 255, .6); }
.bar .note-chip { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .55); }
.bar .note-chip small { color: #fff; opacity: .85; }
.bar .note-chip.on { background: #fff; color: var(--wine); border-color: #fff; }
.bar .note-chip.on small { color: var(--wine); opacity: 1; }
.bar .note-chip.add { color: #fff; border-color: rgba(255, 255, 255, .7); }
.bar .note-chip.all { background: transparent; color: #fff; }
.bar .note-chip.all b { background: #fff; color: var(--wine); }
.notes-row { max-width: 868px; margin: 0 auto 10px; display: flex; gap: 8px; align-items: center; }
.notes { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.notes::-webkit-scrollbar { display: none; }
.note-chip {
  flex: none; display: flex; align-items: baseline; gap: 6px; border: 1.5px solid var(--line); background: var(--bg);
  border-radius: 999px; padding: 8px 14px; font-family: var(--display); font-weight: 600; font-size: .95rem; min-height: 40px; white-space: nowrap;
}
.note-chip small { font-weight: 500; color: var(--muted); font-size: .78rem; }
.note-chip i { font-style: normal; font-weight: 400; opacity: .8; }
.note-chip.on { background: var(--wine); border-color: var(--wine-text); color: var(--wine-ink); }
.note-chip.on small { color: var(--wine-ink); opacity: .85; }
.note-chip.all { background: var(--surface); }
.note-chip.all b { background: var(--wine); color: var(--wine-ink); border-radius: 999px; padding: 0 7px; font-size: .78rem; }
.bar .sum { cursor: pointer; }
.note-list { display: flex; flex-direction: column; gap: 8px; }
.note-card {
  position: relative; text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 14px;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; min-height: 64px;
}
.note-card.on { border-color: var(--wine-text); background: var(--wine-soft); }
.note-card .nc-head { display: flex; justify-content: space-between; gap: 10px; font-size: 1.05rem; }
.note-card .nc-head span { font-family: var(--display); font-weight: 600; color: var(--wine-text); }
.note-card small { color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }
.note-card em { font-style: normal; font-size: .72rem; font-weight: 700; color: var(--wine-text); text-transform: uppercase; letter-spacing: .08em; }
.note-chip.add { border-style: dashed; color: var(--muted); font-weight: 500; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cal-nav { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 1.4rem; }
.cal-sum { text-align: center; }
.cal-sum b { color: var(--ink); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { text-align: center; font-size: .72rem; font-weight: 700; color: var(--muted); padding-block: 4px; }
.cal-cell {
  aspect-ratio: 1 / 1.1; max-width: 100%; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; border: 1px solid transparent; background: transparent; padding: 2px; min-width: 0; color: var(--muted);
}
.cal-cell b { font-size: .95rem; font-weight: 600; }
.cal-cell.has { background: var(--wine-soft); border-color: var(--wine-text); color: var(--ink); }
.cal-cell.has small { font-size: .62rem; font-weight: 700; color: var(--wine-text); white-space: nowrap; }
.cal-cell.today { border-color: var(--ink); }
.cal-cell.empty { visibility: hidden; }
.live { font-family: var(--body); font-size: .75rem; font-weight: 700; color: var(--ok); text-transform: uppercase; letter-spacing: .06em; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 500; min-height: 40px; }
.bar-in { max-width: 868px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.bar .sum { flex: 1; min-width: 0; }
.bar .sum small { display: block; color: var(--muted); font-size: .8rem; }
.bar .sum strong { font-family: var(--display); font-weight: 700; font-size: 1.9rem; line-height: 1;  }
.btn {
  border: 0; border-radius: 12px; padding: 14px 18px; font-family: var(--display); font-weight: 600; font-size: 1.05rem;
  background: var(--wine); color: var(--wine-ink); min-height: 52px;
}
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.ok { background: var(--ok); color: var(--wine-ink); }

/* Feuille d'addition */
.scrim { position: fixed; inset: 0; background: rgba(20, 8, 12, .45); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 92%;
  background: var(--bg); border-radius: 20px 20px 0 0; overflow-y: auto;
  padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  animation: up .2s ease-out;
}
.sheet-in { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
@keyframes up { from { transform: translateY(30px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .tile { transition: none; } }
.grab { width: 42px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 0; }
.sheet h3 { font-family: var(--display); font-weight: 700; font-size: 1.35rem; margin: 0;  }
.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px; }
.ticket .row { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 8px; padding-block: 9px; border-bottom: 1px dashed var(--line); align-items: baseline; }
.ticket .row:last-child { border-bottom: 0; }
.ticket .row .q { font-weight: 700; color: var(--wine-text); }
.ticket .row .l { min-width: 0; overflow-wrap: anywhere; }
.ticket .row .l small { color: var(--muted); display: block; font-size: .75rem; }
.ticket .total { display: flex; justify-content: space-between; align-items: baseline; padding-block: 12px 8px; border-top: 2px solid var(--ink); margin-top: 4px; }
.ticket .total span { font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .8rem; }
.ticket .total strong { font-family: var(--display); font-size: 2rem; font-weight: 700;  }

.label { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.seg button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 6px; font-weight: 700; min-height: 48px; }
.seg button[aria-pressed="true"] { border-color: var(--wine-text); background: var(--wine-soft); color: var(--wine-text); }
.cash { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cash button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 48px; font-weight: 700; }
.given { display: flex; gap: 8px; align-items: center; }
.given input { flex: 1; min-width: 0; font: inherit; font-size: 1.2rem; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.change { display: flex; justify-content: space-between; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.change strong { font-family: var(--display); font-size: 1.6rem; }
.change.pos strong { color: var(--ok); }
.change.neg strong { color: var(--warn); }
.actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }

/* Choix de variante */
.opts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
@media (min-width: 520px) { .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opt { display: flex; gap: 6px; min-width: 0; }
.opt-add {
  position: relative; flex: 1; min-width: 0; min-height: 56px; text-align: left; padding: 12px 44px 12px 14px;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; font-weight: 700; font-size: 1.05rem;
}
.opt.has .opt-add { border-color: var(--wine-text); background: var(--wine-soft); }
.opt-add .qty {
  position: absolute; top: 50%; right: 10px; transform: translateY(-50%); min-width: 28px; height: 28px; border-radius: 999px;
  background: var(--wine); color: var(--wine-ink); display: grid; place-items: center; font-size: .9rem; padding: 0 7px;
}
.opt-minus { flex: none; width: 44px; border-radius: 12px; border: 1px solid var(--wine); background: var(--surface); color: var(--wine-text); font-size: 1.4rem; }
.opt-price { font-weight: 500; color: var(--muted); font-size: .85rem; margin-left: 6px; }
.tile .desc:empty { display: none; }

/* Formulaire produit */
.form { display: flex; flex-direction: column; gap: 12px; }
.form label { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: .9rem; }
.form input, .form select { font: inherit; font-size: 1.05rem; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.danger { color: var(--warn); background: transparent; border: 1px solid var(--warn); }

.hist { font-size: .85rem; }
.hist .row { display: flex; justify-content: space-between; padding-block: 8px; border-bottom: 1px dashed var(--line); gap: 10px; }
.hist .row { align-items: center; }
.hist .h-main { flex: 1; min-width: 0; color: var(--ink); }
.hist .h-main small { display: block; color: var(--muted); font-size: .75rem; overflow-wrap: anywhere; }
.hist .h-amt { font-weight: 700; white-space: nowrap; }
.hist .h-del { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-size: .75rem; color: var(--muted); }
.hist .h-del.armed { border-color: var(--warn); color: var(--warn); }
.ticket .row-edit { grid-template-columns: 2.2em 1fr auto; align-items: center; }
.stepper { display: flex; gap: 6px; }
.stepper button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--wine); background: var(--surface); color: var(--wine-text); font-size: 1.2rem; font-weight: 700; }
.note { color: var(--muted); font-size: .8rem; line-height: 1.4; margin: 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: #fff; color: var(--wine); border: 1.5px solid var(--wine); box-shadow: var(--shadow); padding: 10px 16px; font-weight: 700; border-radius: 999px; font-weight: 500; z-index: 30;
  font-size: .9rem; white-space: nowrap;
}
html { padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <button type="button" class="logo-btn" id="btn-cal" aria-label="Calendrier des soirées"><img class="logo" src="logo.png" width="196" height="160" alt="3T Théâtre Apéro Tapas"></button>
    <h1 class="sr-only">Caisse du 3T</h1>
    <span class="owner" id="btn-owner" hidden></span>
  </div>
  <div class="top-actions">
    <button class="chip-btn" id="btn-hist" type="button">Soirée</button>
    <button class="chip-btn" id="btn-edit" type="button" aria-pressed="false">Modifier la carte</button>
  </div>
</header>

<div class="day" id="day"></div>
<main id="menu"></main>

<div class="bar">
  <div class="notes-row">
    <button type="button" class="note-chip all" id="btn-notes-all" hidden>Notes <b id="notes-n"></b></button>
    <button type="button" class="note-chip add" id="btn-note-add" aria-label="Ouvrir une nouvelle note">+ Note</button>
    <div class="notes" id="notes" aria-label="Notes ouvertes"></div>
  </div>
  <div class="bar-in">
    <div class="sum">
      <small id="bar-count">Commande vide</small>
      <strong id="bar-total">0,00 €</strong>
    </div>
    <button class="btn ghost" id="btn-clear" type="button">Vider</button>
    <button class="btn" id="btn-pay" type="button">Addition</button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-in" id="sheet-in"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const RAYONS = ["Ardoises", "Vins", "Bières", "Cocktails", "Softs", "Divers"];
  const MENU_VERSION = 11;
  const SIROPS = ["Menthe", "Pêche", "Citron", "Fraise", "Grenadine", "Cassis"];
  const DEFAULT_MENU = [
    { id: "a1", cat: "Ardoises", name: "Ardoise fromage", desc: "Simple", price: 14 },
    { id: "a2", cat: "Ardoises", name: "Ardoise charcuterie", desc: "Simple", price: 14 },
    { id: "a3", cat: "Ardoises", name: "Ardoise veggie", desc: "Simple", price: 14 },
    { id: "a4", cat: "Ardoises", name: "Ardoise mixte", desc: "Fromage + charcuterie", price: 26 },
    { id: "a6", cat: "Ardoises", name: "Petite rillette", desc: "", price: 7 },
    { id: "a7", cat: "Ardoises", name: "Grande rillette", desc: "", price: 11 },
    { id: "a5", cat: "Ardoises", name: "Ardoise des copains", desc: "Guacamole, labneh, piquillos, jambon, fromage", price: 26 },
    { id: "b1", cat: "Vins", name: "Verre de rouge", desc: "", price: 5 },
    { id: "b2", cat: "Vins", name: "Verre de blanc", desc: "", price: 5 },
    { id: "b3", cat: "Vins", name: "Verre de rosé", desc: "", price: 5 },
    { id: "v4", cat: "Vins", name: "Verre de moelleux", desc: "", price: 5 },
    { id: "b7", cat: "Vins", name: "Bouteille de vin", desc: "Choisir la couleur", price: 25, opts: ["Rouge", "Rosé", "Blanc sec", "Moelleux"] },

      <div class="cash">
        ${[t, 20, 50, 100].map((v, i) => `<button type="button" data-cash="${v}">${i === 0 ? "Compte juste" : v + " €"}</button>`).join("")}
        ${[5, 10].map(v => `<button type="button" data-cashadd="${v}">+${v} €</button>`).join("")}
        <button type="button" data-cashadd="2">+2 €</button>
        <button type="button" data-cash="0">Effacer</button>
      </div>
      <div class="given"><input id="given" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Montant donné" value="${given || ""}"></div>
      <div class="change" id="change"><span></span><strong></strong></div>` : "";
    openSheet(`
      <h3>Addition${notes.length > 1 || active().name !== "Note 1" ? " · " + esc(active().name) : ""}</h3>
      <div class="ticket">${rows}
        <div class="total"><span>Total</span><strong>${eur(t)}</strong></div>
      </div>
      <div class="label">Paiement</div>
      <div class="seg">${["Espèces", "CB"].map(m => `<button type="button" data-mode="${m}" aria-pressed="${m === payMode}">${m}</button>`).join("")}</div>
      ${cashBlock}
      <div class="actions">
        <button class="btn ghost" type="button" data-close>Retour</button>
        <button class="btn ok" type="button" data-done id="btn-done">Encaisser ${eur(t)}</button>
      </div>`);
    const inp = $("#given");
    if (inp) inp.addEventListener("input", () => { given = parseFloat(inp.value.replace(",", ".")) || 0; updateChange(); });
    updateChange();
  }
  // Monnaie à rendre, mise à jour à chaque chiffre tapé
  function updateChange() {
    const box = $("#change"), done = $("#btn-done");
    const diff = Math.round((given - total()) * 100) / 100;
    if (box) {
      box.className = "change" + (given ? (diff >= 0 ? " pos" : " neg") : "");
      box.querySelector("span").textContent = given && diff < 0 ? "Il manque" : "À rendre";
      box.querySelector("strong").textContent = given ? eur(Math.abs(diff)) : "—";
    }
    if (done) done.disabled = payMode === "Espèces" && given > 0 && diff < 0;
  }

  $("#sheet").addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.hasAttribute("data-close")) return closeSheet();
    if (t.dataset.pick) { bump(pickId + "::" + t.dataset.pick, 1); closeSheet(); toast(`${byId(pickId).name} · ${t.dataset.pick}`); return; }
    if (t.dataset.unpick) { bump(pickId + "::" + t.dataset.unpick, -1); return openPick(pickId); }
    if (t.dataset.mode) { payMode = t.dataset.mode; return renderPay(); }
    if (t.dataset.line) { bump(t.dataset.line, +t.dataset.d); return count() ? renderPay() : closeSheet(); }
    if (t.dataset.cancel) return cancelSale(t);
    if (t.hasAttribute("data-copy")) return copyRecap();
    if (t.dataset.cash !== undefined) { given = +t.dataset.cash; return renderPay(); }
    if (t.dataset.cashadd) { given = Math.round((given + +t.dataset.cashadd) * 100) / 100; return renderPay(); }
    if (t.hasAttribute("data-done")) {
      const tot = total();
      if (!tot && !count()) return closeSheet();
      const name = active().name;
      sales.push({ t: Date.now(), total: tot, mode: payMode, note: name, lines: lines().map(l => ({ n: label(l), q: l.q, p: l.price })) });
      closeNote(); save(); closeSheet(); render();
      toast(`${name} encaissée : ${eur(tot)}` + (notes.length > 1 || !isEmpty(active()) ? ` · ${active().name} affichée` : ""));
      return;
    }
    if (t.hasAttribute("data-save")) return saveEdit();
    if (t.hasAttribute("data-note-save")) return saveNoteName();
    if (t.dataset.calmove) return moveMonth(+t.dataset.calmove);
    if (t.dataset.calday) return openCalDay(t.dataset.calday);
    if (t.hasAttribute("data-calback")) return openCalendar();
    if (t.hasAttribute("data-opencal")) { calMonth = null; return openCalendar(); }
    if (t.dataset.goto) { closeSheet(); if (t.dataset.goto !== activeId) switchNote(t.dataset.goto); return; }
    if (t.hasAttribute("data-newnote")) { closeSheet(); return newNote(); }
    if (t.dataset.quickname) return saveNoteName(t.dataset.quickname);
    if (t.hasAttribute("data-note-del")) return delNote(t);
    if (t.hasAttribute("data-del")) return delEdit(t);
    if (t.hasAttribute("data-reset-day")) return resetDay(t);
    if (t.hasAttribute("data-reset-menu")) return resetMenu(t);
  });

  // Édition produit
  let editId = null;
  function openEdit(id, cat) {
    editId = id;
    const m = id ? byId(id) : { name: "", desc: "", price: "", cat };
    openSheet(`
      <h3>${id ? "Modifier le produit" : "Nouveau produit"}</h3>
      <form class="form" id="pform">
        <label>Nom<input id="f-name" required value="${esc(m.name)}" placeholder="ex. Café"></label>
        <label>Détail (facultatif)<input id="f-desc" value="${esc(m.desc || "")}"></label>
        <label>Prix (€)<input id="f-price" type="number" inputmode="decimal" step="0.10" min="0" required value="${m.price}"></label>
        <label>Choix proposés (séparés par des virgules, facultatif)<input id="f-opts" value="${esc((m.opts || []).map(o => m.optPrices && m.optPrices[o] != null ? `${o} = ${m.optPrices[o].toFixed(2).replace(".", ",")}` : o).join(", "))}" placeholder="ex. Nature, Menthe = 5,50"></label>
        <p class="note">Pour un choix plus cher, ajoutez son prix : « Menthe = 5,50 ».</p>
        <label>Rayon<select id="f-cat">${RAYONS.map(c => `<option${c === m.cat ? " selected" : ""}>${c}</option>`).join("")}</select></label>
      </form>
      <div class="actions">
        ${id ? `<button class="btn danger" type="button" data-del>Supprimer</button>` : `<button class="btn ghost" type="button" data-close>Annuler</button>`}
        <button class="btn" type="button" data-save>Enregistrer</button>
      </div>
      <button class="btn ghost" type="button" data-reset-menu>Remettre la carte d'origine</button>`);
    $("#pform").addEventListener("submit", e => { e.preventDefault(); saveEdit(); });
  }
  function saveEdit() {
    const name = $("#f-name").value.trim();
    const price = parseFloat($("#f-price").value.replace(",", "."));
    if (!name || isNaN(price)) { toast("Indiquez un nom et un prix"); return; }
    // Les virgules décimales ("5,50") ne coupent pas un choix : on découpe sur une virgule suivie d'un espace ou d'une lettre
    const raw = $("#f-opts").value.split(/,(?!\d)/).map(x => x.trim()).filter(Boolean);
    const opts = [], optPrices = {};
    raw.forEach(r => {
      const [n, pr] = r.split("=").map(x => x.trim());
      if (!n) return;
      opts.push(n);
      const v = parseFloat((pr || "").replace(",", "."));
      if (!isNaN(v)) optPrices[n] = v;
    });
    const data = { name, price, desc: $("#f-desc").value.trim(), cat: $("#f-cat").value,
      opts: opts.length ? opts : undefined, optPrices: Object.keys(optPrices).length ? optPrices : undefined };
    if (editId) Object.assign(byId(editId), data);
    else menu.push({ id: "p" + Date.now().toString(36), ...data });
    save(); closeSheet(); render(); toast("Carte mise à jour");
  }
  function delEdit(b) {
    if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Confirmer"; return; }
    menu = menu.filter(m => m.id !== editId);
    notes.forEach(n => Object.keys(n.order).forEach(k => { if (k.split("::")[0] === editId) delete n.order[k]; }));
    save(); closeSheet(); render(); toast("Produit supprimé");
  }
  function resetMenu(b) {
    if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Confirmer : remettre la carte d'origine"; return; }
    menu = DEFAULT_MENU.map(x => ({ ...x }));
    notes.forEach(n => Object.keys(n.order).forEach(k => delete n.order[k]));
    save(); closeSheet(); render(); toast("Carte d'origine remise");
  }

  // Soirée
  const fmtDay = d => new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  const time = t => new Date(t).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

  function openSoiree() {
    const s = todaySales();
    const sm = summarize(s);
    const items = Object.entries(sm.byItem).sort((a, b) => b[1] - a[1]);
    openSheet(`
      <h3>Soirée du ${fmtDay(serviceDay())}</h3>
      <p class="note">${owner ? `Caisse de <b>${esc(owner)}</b> · ` : ""}<button type="button" class="linkish" data-owner>${owner ? "Changer le nom" : "Donner un nom à cette caisse"}</button></p>
      <div class="ticket">
        ${Object.entries(sm.byMode).map(([m, v]) => `<div class="row"><span></span><span class="l">${m}</span><span>${eur(v)}</span></div>`).join("") || `<p class="note" style="padding-block:10px">Aucune commande encaissée ce soir.</p>`}
        <div class="total"><span>${sm.count} commande${sm.count > 1 ? "s" : ""}</span><strong>${eur(sm.total)}</strong></div>
      </div>
      ${items.length ? `<div class="label">Produits vendus</div><div class="ticket">${items.map(([n, q]) => `<div class="row"><span class="q">${q}×</span><span class="l">${esc(n)}</span><span></span></div>`).join("")}</div>` : ""}
      ${s.length ? `<div class="label">Commandes</div><div class="hist">${s.slice().reverse().map(x => `
        <div class="row">
          <span class="h-main"><b>${time(x.t)}</b>${x.note && x.note !== "Note 1" ? " · " + esc(x.note) : ""} · ${x.mode}<small>${esc(x.lines.map(l => (l.q > 1 ? l.q + "× " : "") + l.n).join(", "))}</small></span>
          <span class="h-amt">${eur(x.total)}</span>
          <button type="button" class="h-del" data-cancel="${x.t}" aria-label="Annuler cette commande">Annuler</button>
        </div>`).join("")}</div>` : ""}
      <div class="actions">
        <button class="btn ghost" type="button" data-copy ${s.length ? "" : "disabled"}>Copier le récap</button>
        <button class="btn danger" type="button" data-reset-day ${s.length ? "" : "disabled"}>Clôturer la soirée</button>
      </div>
      ${closed.length ? `<div class="label">Soirées précédentes</div><div class="hist">${closed.slice(0, 3).map(c => `
        <div class="row"><span class="h-main">${fmtDay(c.day)}<small>${c.count} commande${c.count > 1 ? "s" : ""} · ${Object.entries(c.byMode).map(([m, v]) => m + " " + eur(v)).join(" · ")}</small></span><span class="h-amt">${eur(c.total)}</span></div>`).join("")}</div>
      <button class="btn ghost" type="button" data-opencal>Voir le calendrier des soirées</button>` : ""}
      <p class="note">La soirée va jusqu'à 6 h du matin. Les ventes sont gardées sur ce téléphone uniquement. Version de l’appli : ${APP_VERSION}.</p>
      <button class="btn ghost" type="button" data-close>Fermer</button>
      <textarea id="recap" class="sr-only" readonly tabindex="-1" aria-hidden="true"></textarea>`);
  }
  $("#btn-hist").addEventListener("click", openSoiree);
  // Calendrier des soirées (toucher le logo)
  let calMonth = null; // "AAAA-MM"
  function daySummaries() {
    const map = {};
    closed.forEach(c => map[c.day] = { ...c, byMode: { ...c.byMode }, byItem: { ...c.byItem } });
    const cur = todaySales();
    if (cur.length) {
      const sm = summarize(cur), d = serviceDay(), prev = map[d];
      if (prev) {
        prev.total += sm.total; prev.count += sm.count; prev.live = true;
        Object.entries(sm.byMode).forEach(([k, v]) => prev.byMode[k] = (prev.byMode[k] || 0) + v);
        Object.entries(sm.byItem).forEach(([k, v]) => prev.byItem[k] = (prev.byItem[k] || 0) + v);
      } else map[d] = { day: d, ...sm, live: true };
    }
    return map;
  }
  function openCalendar() {
    if (!calMonth) calMonth = serviceDay().slice(0, 7);
    const [y, m] = calMonth.split("-").map(Number);
    const map = daySummaries();
    const first = new Date(y, m - 1, 1), days = new Date(y, m, 0).getDate();
    const lead = (first.getDay() + 6) % 7; // semaine commençant le lundi
    const today = serviceDay();
    const inMonth = Object.values(map).filter(d => d.day.startsWith(calMonth));
    const monthTotal = inMonth.reduce((a, d) => a + d.total, 0);
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push(`<span class="cal-cell empty"></span>`);
    for (let d = 1; d <= days; d++) {
      const key = `${calMonth}-${String(d).padStart(2, "0")}`, x = map[key];
      const cls = "cal-cell" + (x ? " has" : "") + (key === today ? " today" : "");
      cells.push(x
        ? `<button type="button" class="${cls}" data-calday="${key}" aria-label="${fmtDay(key)} : ${eur(x.total)}"><b>${d}</b><small>${Math.round(x.total)} €</small></button>`
        : `<span class="${cls}"><b>${d}</b></span>`);
    }
    const title = first.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
    openSheet(`
      <div class="cal-head">
        <button type="button" class="cal-nav" data-calmove="-1" aria-label="Mois précédent">‹</button>
        <h3>${title.charAt(0).toUpperCase() + title.slice(1)}</h3>
        <button type="button" class="cal-nav" data-calmove="1" aria-label="Mois suivant">›</button>
      </div>
      <p class="note cal-sum">${inMonth.length ? `${inMonth.length} soirée${inMonth.length > 1 ? "s" : ""} · <b>${eur(monthTotal)}</b>` : "Aucune soirée enregistrée ce mois-ci."}</p>
      <div class="cal-grid">${["L", "M", "M", "J", "V", "S", "D"].map(d => `<span class="cal-dow">${d}</span>`).join("")}${cells.join("")}</div>
      <button class="btn ghost" type="button" data-close>Fermer</button>`);
  }
  function openCalDay(key) {
    const x = daySummaries()[key]; if (!x) return;
    const items = Object.entries(x.byItem).sort((a, b) => b[1] - a[1]);
    openSheet(`
      <h3>${fmtDay(key).charAt(0).toUpperCase() + fmtDay(key).slice(1)}${x.live ? ' <small class="live">en cours</small>' : ""}</h3>
      <div class="ticket">
        ${Object.entries(x.byMode).map(([m, v]) => `<div class="row"><span></span><span class="l">${m}</span><span>${eur(v)}</span></div>`).join("")}
        <div class="total"><span>${x.count} commande${x.count > 1 ? "s" : ""}</span><strong>${eur(x.total)}</strong></div>
      </div>
      ${items.length ? `<div class="label">Produits vendus</div><div class="ticket">${items.map(([n, q]) => `<div class="row"><span class="q">${q}×</span><span class="l">${esc(n)}</span><span></span></div>`).join("")}</div>` : ""}
      <button class="btn ghost" type="button" data-calback>‹ Retour au calendrier</button>`);
  }
  function moveMonth(d) {
    const [y, m] = calMonth.split("-").map(Number);
    const t = new Date(y, m - 1 + d, 1);
    calMonth = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}`;
    openCalendar();
  }
  $("#btn-cal").addEventListener("click", () => { calMonth = null; openCalendar(); });


  function cancelSale(b) {
    if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Confirmer"; b.classList.add("armed"); return; }
    sales = sales.filter(x => String(x.t) !== b.dataset.cancel);
    save(); render(); openSoiree(); toast("Commande annulée");
  }

  function recapText() {
    const sm = summarize(todaySales());
    return [
      `3T · ${owner ? "Caisse de " + owner + " · " : ""}Soirée du ${fmtDay(serviceDay())}`,
      `${sm.count} commande${sm.count > 1 ? "s" : ""} · Total ${eur(sm.total)}`,
      ...Object.entries(sm.byMode).map(([m, v]) => `- ${m} : ${eur(v)}`),
      "",
      "Produits vendus :",
      ...Object.entries(sm.byItem).sort((a, b) => b[1] - a[1]).map(([n, q]) => `- ${q}× ${n}`),
    ].join("\n");
  }
  async function copyRecap() {
    const txt = recapText();
    try { await navigator.clipboard.writeText(txt); toast("Récap copié : collez-le dans un SMS"); }
    catch {
      const ta = $("#recap"); ta.value = txt; ta.select();
      try { document.execCommand("copy"); toast("Récap copié : collez-le dans un SMS"); } catch { toast("Copie impossible sur ce téléphone"); }
    }
  }

  function resetDay(b) {
    if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Confirmer la clôture"; return; }
    archive(todaySales());
    save(); closeSheet(); render(); toast("Soirée clôturée et archivée");
  }

  // Garde l'écran allumé pendant le service (si le téléphone le permet)
  let wake = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator && !document.hidden && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch {}
  }
  document.addEventListener("visibilitychange", keepAwake);
  keepAwake();

  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  // Chaque téléphone a sa propre caisse : un prénom permet de la reconnaître
  // et figure sur le récap envoyé en fin de soirée
  let owner = store.get("3t-owner", "");
  function renderOwner() {
    const b = $("#btn-owner"); b.hidden = !owner; b.textContent = owner;
    b.setAttribute("aria-label", "Caisse de " + owner);
  }
  function openOwner(first) {
    openSheet(`
      <form class="form owner-form" id="oform">
        <img src="logo.png" alt="" width="98" height="80" class="owner-logo">
        <label for="f-owner">Votre prénom</label>
        <input id="f-owner" value="${esc(owner)}" maxlength="20" autocomplete="given-name" placeholder="ex. Julie">
      </form>
      <div class="${first ? "" : "actions"}">
        ${first ? "" : `<button class="btn ghost" type="button" data-close>Annuler</button>`}
        <button class="btn${first ? " wide" : ""}" type="button" data-owner-save>${first ? "Commencer" : "Enregistrer"}</button>
      </div>`, { center: true, locked: first });
    $("#oform").addEventListener("submit", e => { e.preventDefault(); saveOwner(); });
  }
  function saveOwner() {
    const v = $("#f-owner").value.trim();
    if (!v) { toast("Indiquez un prénom"); return; }
    owner = v; store.set("3t-owner", owner); renderOwner(); sheetLocked = false; closeSheet(); toast("Caisse de " + owner);
  }
  $("#sheet").addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.hasAttribute("data-owner")) openOwner(false);
    if (t.hasAttribute("data-owner-save")) saveOwner();
  });

  render();
  renderOwner();
  if (!owner) openOwner(true);
})();
// Numéro de cette version de l'appli : doit être identique à celui de version.json
const APP_VERSION = 26;

// Mise à jour automatique. À chaque ouverture et à chaque retour sur l'appli, on demande
// version.json au réseau. Si le numéro publié est plus récent, on vide la copie locale
// et on recharge : le téléphone récupère la nouvelle version sans réinstallation.
async function checkForUpdate() {
  try {
    const res = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const { version } = await res.json();
    if (!(version > APP_VERSION)) return;
    // Juste après une publication, GitHub peut encore servir l'ancienne page quelques minutes :
    // on réessaie alors toutes les 30 secondes au plus, sans jamais boucler
    const key = "3t-tried-" + version;
    let tries = {};
    try { tries = JSON.parse(sessionStorage.getItem(key)) || {}; } catch {}
    if (tries.at && Date.now() - tries.at < 30000) return;
    try { sessionStorage.setItem(key, JSON.stringify({ at: Date.now() })); } catch {}
    if ("caches" in window) await Promise.all((await caches.keys()).map(k => caches.delete(k)));
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update().catch(() => {});
    location.reload();
  } catch { /* hors connexion : on garde la version locale */ }
}
window.addEventListener("load", checkForUpdate);
setInterval(() => { if (!document.hidden) checkForUpdate(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkForUpdate(); });

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
      document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  });
  // Nouveau service worker installé : recharge une fois (la commande en cours est enregistrée)
  let reloaded = false;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloaded) return;
    reloaded = true; location.reload();
  });
}
</script>
</body>
</html>
